pre-commit:
  commands:
    fmt:
      run: cargo +nightly fmt --all
      stage_fixed: true

pre-push:
  commands:
    clippy:
      run: >
        cargo clippy
        -p seismic-revm
        --lib --tests --no-deps
        -- -D warnings
        -W clippy::unwrap_used
        -W clippy::expect_used
        -W clippy::indexing_slicing
        -W clippy::panic
        -W clippy::unreachable
        -W clippy::todo
