[package]
name = "revme"
description = "Rust Ethereum Virtual Machine Executable"
version = "7.2.2"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cargo_metadata.workspace = true
log = "0.4"
env_logger = "0.9"
rayon = "1.5"
regex = "1.11.1"

# revm
revm = { workspace = true, features = ["std", "hashbrown", "c-kzg", "blst"] }
primitives.workspace = true
database.workspace = true
database-interface.workspace = true
state.workspace = true
bytecode = { workspace = true, features = ["std", "parse"] }
context.workspace = true
context-interface.workspace = true
inspector = { workspace = true, features = ["std", "tracer"] }
statetest-types.workspace = true
criterion.workspace = true

#seismic
seismic-revm = { workspace = true, default-features = true, features = ["serde"] }

# alloy
alloy-rlp = { workspace = true, features = ["arrayvec", "derive"] }
alloy-sol-types.workspace = true

# misc
hash-db.workspace = true
indicatif.workspace = true
plain_hasher.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
clap.workspace = true
thiserror.workspace = true
triehash.workspace = true
walkdir.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
csv = "1.1.6"

[features]
# Optionally enable gmp because it doesn't work on i686 github actions runners
gmp = ["revm/gmp"]
# Ethereum state tests provide timestamps in seconds, but Seismic's TIMESTAMP opcode
# divides by 1000 (assuming milliseconds from the host). Enable this feature to skip
# that division so state tests produce correct results.
timestamp-in-seconds = ["seismic-revm/timestamp-in-seconds"]

[[bench]]
name = "evm"
harness = false
